<app-data-table [dataSource]="dataSourceWordType"
           [tableData]="tableWordData()"
           [totalCount]="totalCount"
           [selection]="selection"
           [isExpandable]="isExpandable"
           [isShowSelection]="isShowSelection"
           [displayedColumns]="displayedColumns"
           [sortedColumns]="sortedColumns"
           [expandedElement]="expandedElement"
           [columnsToDisplayWithExpandInput]="columnsToDisplayWithExpand"
           [ceilTemplates]="displayedTemplates"
           [expandTemplate]="expandTemplate"
           [pageSizeOptions]="pageSizeOptions"
           (pageChange)="onPageChange($event)"
           (sortChange)="onSortChange($event)"
           (selectionResult)="onSelectionResult($event)">
</app-data-table>

<ng-template #text let-data>
  <p i18n class="text-xl">{{ data?.text }}
    <!--    <span class="text-sm">{{data?.id}}</span>-->
  </p>
</ng-template>

<ng-template #translations let-data>
  <p i18n>{{ data?.translations[0].text }}@if(data?.translations[1]){; {{data?.translations[1].text}}; ...} - ({{ data?.translations.length }})</p>
</ng-template>

<ng-template #voice>
  <button i18n mat-icon-button aria-label="Example icon button with a volume icon"
          (click)="getVoice($event)">
    <mat-icon>volume_up</mat-icon>
  </button>
</ng-template>

<ng-template #actions let-data>
<!--  <button mat-raised-button  (click)="editWord($event, data)">Edit<mat-icon>edit</mat-icon></button>-->
  <button mat-icon-button [matMenuTriggerFor]="menu"
          (click)="preventMenu($event)"
          aria-label="icon-button with a menu">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu" yPosition="below">
    <button mat-menu-item (click)="editWordDialogOpen($event, data)">
      <mat-icon>edit</mat-icon>
      Edit
    </button>

    <button  mat-menu-item (click)="addToWordSet($event, data)">
      <mat-icon>edit</mat-icon>
      <span>Add to Set</span>
    </button>

    <button mat-menu-item (click)="deleteWord($event, data)">
      <mat-icon color="warn">delete_outline</mat-icon>
      <span>Delete</span>
    </button>
  </mat-menu>
</ng-template>

<ng-template #expandTemplate let-translation>
  <div class="flex sm:flex-row md:flex-col w-full mb-2 flex-col items-center justify-between" style="border: 1px solid red;">
    <div class="w-full md:w-1/3 h-fit p-2 pl-10 " style="border: 1px solid blue;">
      <p class="text-xl">{{ translation.text }}</p>
    </div>
    <div class="w-full md:w-2/3 h-fit p-2" style="border: 1px solid blue;">
      <p class="text-xl">{{ translation?.description }}</p>
    </div>
  </div>
  <hr>
</ng-template>
