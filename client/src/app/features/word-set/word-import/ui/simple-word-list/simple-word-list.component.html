<form [formGroup]="form">
  <div formArrayName="items">

<!--    <mat-grid-list cols="12" rowHeight="100px" gutterSize="20px">-->
<!--      @for (tile of tiles; track tile) {-->
<!--        <mat-grid-tile-->
<!--          [colspan]="tile.cols"-->
<!--          [rowspan]="tile.rows"-->

<!--      }-->
<!--    </mat-grid-list>-->

    <ng-container *ngFor="let wordItem of listArr.controls; let i = index; let isLast = last; trackBy trackById">
      <div [formGroupName]="i" class="word-set__list">
        <article class="word-set__list-item">
          <mat-card class="word-set__card" appearance="outlined">
            <mat-card-content class="word-set__card-content">
              <div class="word-set__card-field">
                <mat-form-field class="word-set__input-field">
                  <mat-label>Term</mat-label>
<!--                         [disabled]="disabled"-->
                  <input matInput [readonly]="true"
                         formControlName="term">
                </mat-form-field>
              </div>
              <div class="word-set__card-field">
                <mat-form-field class="word-set__input-field">
                  <mat-label>Definition</mat-label>
                  <input matInput [readonly]="true"
                         formControlName="definition">
<!--                         [disabled]="disabled"-->
                </mat-form-field>
              </div>
            </mat-card-content>
          </mat-card>
        </article>
      </div>
    </ng-container>
  </div>
</form>
